name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LegacyBridge.sln

      - name: Build
        run: dotnet build LegacyBridge.sln -c Release --no-restore

      - name: Test
        run: dotnet test LegacyBridge.sln -c Release --no-build --verbosity normal
